<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="580" width="1200" height="50" fill="url(#accent)" opacity="0.8"/>
  <circle cx="150" cy="315" r="60" fill="url(#accent)" opacity="0.15"/>
  <circle cx="1050" cy="200" r="80" fill="url(#accent)" opacity="0.1"/>
  <circle cx="900" cy="480" r="40" fill="url(#accent)" opacity="0.1"/>
  <!-- Chart icon -->
  <g transform="translate(540, 160)">
    <rect x="0" y="60" width="24" height="60" rx="4" fill="#2563EB" opacity="0.7"/>
    <rect x="36" y="30" width="24" height="90" rx="4" fill="#2563EB" opacity="0.85"/>
    <rect x="72" y="0" width="24" height="120" rx="4" fill="#2563EB"/>
    <line x1="0" y1="120" x2="96" y2="120" stroke="#2563EB" stroke-width="2" opacity="0.5"/>
    <polyline points="8,55 44,25 80,-5" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Company name -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Datra<tspan fill="#FBBF24">Analytics</tspan>
  </text>
  <!-- Tagline -->
  <text x="600" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Real Estate Data Intelligence Platform
  </text>
  <!-- Features -->
  <text x="600" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748b">
    Property Analytics  |  Market Trends  |  Government Records  |  Developer Rankings
  </text>
  <!-- URL -->
  <text x="600" y="610" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    datraanalytics.com
  </text>
</svg>
